<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="G-WORK">
<meta name="theme-color" content="#0b0e12">
<meta name="color-scheme" content="dark">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<title>G-WORK</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Barlow:ital,wght@1,900&display=swap">
<style>
/* Layout: investing-app feel for the gym. Near-black canvas, rounded dark cards, one mint accent, big bold figures, pill buttons. */
:root{
  --bg:#0b0e12; --surface:#141920; --surface2:#1d242d; --line:#252d38;
  --ink:#f2f5f7; --muted:#8a95a3; --accent:#19d3a2; --on-accent:#04110d;
  --good:#19d3a2; --pr:#19d3a2; --pr-bg:#0f2f29; --warn:#ff6b6b;
  --display:'DM Sans','Helvetica Neue',Arial,sans-serif; --body:var(--display);
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent;padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.35 var(--body);font-variant-numeric:tabular-nums;
  padding-block:0 76px;padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px))}
[hidden]{display:none!important}
#app{max-width:560px;margin:0 auto}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
button,.btn{touch-action:manipulation}
input,select{font-size:16px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.top{display:flex;align-items:center;justify-content:space-between;padding:12px 0 10px;flex-wrap:wrap;gap:2px 10px}
.brand{color:var(--ink);font:italic 900 28px/1 'Barlow','Arial Black',Impact,sans-serif;text-transform:uppercase;letter-spacing:.01em;white-space:nowrap}
.brand::first-letter{color:var(--accent)}
#sync{font-size:11px;color:var(--muted)}
h2{font:700 28px/1.1 var(--display);letter-spacing:-.02em;margin:4px 0 2px}
.label{font:500 12px/1.2 var(--body);color:var(--muted)}
.num{font-family:var(--display);font-weight:700;letter-spacing:-.02em}
.stack{display:flex;flex-direction:column;gap:8px}
.card{background:var(--surface);border-radius:16px;padding:14px;min-width:0}
.row{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.btn{min-height:40px;padding:0 16px;border-radius:999px;border:0;background:var(--surface2);font-weight:600;color:var(--ink)}
.btn.primary{background:var(--accent);color:var(--on-accent);font:700 15px var(--display);min-height:46px}
.btn.small{min-height:32px;padding:0 13px;font-size:13px}
.btn.ghost{background:transparent;box-shadow:inset 0 0 0 1px var(--line)}
.btn.danger{color:var(--warn);background:transparent;box-shadow:inset 0 0 0 1px rgba(255,107,107,.45)}
.btn.block{width:100%}
.btn[disabled]{opacity:.35;cursor:default}
.weekhead{display:flex;align-items:center;gap:8px;background:var(--surface2);border-radius:14px;padding:6px}
.weekhead .btn{background:var(--surface)}
.weekhead .mid{flex:1;text-align:center}
.weekhead .big{font:700 17px/1.15 var(--display);margin-top:2px;letter-spacing:-.01em}
.chip{display:inline-block;padding:3px 10px;border-radius:999px;background:var(--surface2);font-size:12px;font-weight:600}
.chip.ok{background:var(--pr-bg);color:var(--good)}
.chip.pr{background:var(--pr-bg);color:var(--pr)}
.lift{display:grid;grid-template-columns:1fr auto;gap:6px 8px;align-items:center}
.lift .name{font:700 19px/1.15 var(--display);letter-spacing:-.01em}
.lift .sets{grid-column:1/-1;display:flex;gap:6px;flex-wrap:wrap}
.lift .sets span{background:var(--surface2);border-radius:999px;padding:4px 10px;font-size:13px;color:var(--muted)}
.lift .sets span b{font-weight:700;color:var(--ink)}
.banner{background:var(--pr-bg);color:var(--good);border-radius:16px;padding:14px}
.banner .num{font-size:28px;line-height:1.1;color:var(--ink)}
.cur{text-align:center;padding:16px 12px}
.cur .w{font-size:68px;line-height:1;letter-spacing:-.03em}
.cur .unit{font:600 18px var(--display);color:var(--muted);margin-left:5px}
.cur .tgt{font:700 22px/1 var(--display);margin-top:6px;color:var(--accent)}
.plates{margin-top:6px;color:var(--muted);font-size:13px}
.steps{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}
.stepper{display:flex;align-items:center;justify-content:space-between;gap:4px;background:var(--surface2);border-radius:14px;padding:4px}
.stepper button{width:40px;height:40px;border-radius:50%;border:0;background:var(--surface);font:600 20px var(--display)}
.stepper .v{font:700 19px var(--display);min-width:0;text-align:center;line-height:1.1}
.stepper .v small{display:block;font:500 11px var(--body);color:var(--muted)}
.rest{border-radius:16px;background:var(--surface);padding:14px;box-shadow:inset 0 0 0 1px var(--accent)}
.rest.over{box-shadow:inset 0 0 0 1px var(--warn)}
.rest .t{font:700 46px/1 var(--display);text-align:center;letter-spacing:-.03em;color:var(--accent)}
.rest.over .t{color:var(--warn)}
.bar{height:6px;border-radius:99px;background:var(--surface2);overflow:hidden;margin:10px 0}
.bar i{display:block;height:100%;width:0;background:var(--accent);border-radius:99px}
.rest.over .bar i{background:var(--warn)}
.setlist{display:flex;flex-direction:column}
.setlist div{display:flex;justify-content:space-between;gap:8px;padding:9px 0;border-top:1px solid var(--line)}
.setlist div:first-child{border-top:0}
.setlist .on{font-weight:700;color:var(--accent)}
.setlist .ok{color:var(--muted)}
.setlist .ok b{color:var(--ink)}
.field{display:flex;flex-direction:column;gap:5px}
input[type=number],input[type=text],select{min-height:42px;border-radius:12px;border:1px solid var(--line);background:var(--surface2);padding:0 12px;width:100%;color:var(--ink)}
input::placeholder{color:var(--muted)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pr-card .big{font-size:34px;line-height:1;letter-spacing:-.03em}
.pr-card .meta{color:var(--muted);font-size:13px}
.hint{color:var(--muted);font-size:13px}
.trophy{background:linear-gradient(165deg,#0f3a31 0%,var(--surface) 62%);border-radius:20px;padding:16px;text-align:center;display:flex;flex-direction:column;gap:2px;box-shadow:inset 0 0 0 1px rgba(25,211,162,.35)}
.trophy .logo{font:italic 900 26px/1 'Barlow','Arial Black',Impact,sans-serif;color:var(--ink);text-transform:uppercase}
.trophy .logo::first-letter{color:var(--accent)}
.trophy .tag{font:700 11px/1 var(--body);letter-spacing:.16em;color:var(--accent);margin-top:4px}
.trophy .lf{font:600 16px/1.2 var(--display);margin-top:8px;color:var(--muted)}
.trophy .big{font:700 52px/1 var(--display);letter-spacing:-.03em;margin-top:2px}
.trophy .big small{font-size:16px;color:var(--muted);margin-left:4px;letter-spacing:0}
.trophy .sub{color:var(--good);font-size:13px;font-weight:600}
.trophy .foot{font-size:12px;color:var(--muted);margin-top:6px;padding-top:8px;border-top:1px solid rgba(255,255,255,.08)}
.tabs{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;background:rgba(11,14,18,.94);border-top:1px solid var(--line);
  padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px));z-index:5}
.tabs .in{display:flex;gap:4px;width:100%;max-width:560px}
.tabs button{flex:1;min-height:40px;border:0;background:transparent;border-radius:999px;font:600 13px var(--display);padding:0 2px;color:var(--muted)}
.tabs button[aria-current=true]{color:var(--accent);background:var(--surface2)}
.slide{position:relative;height:44px;border-radius:999px;background:var(--surface2);overflow:hidden;user-select:none;-webkit-user-select:none}
.slide-fill{z-index:1;position:absolute;top:0;bottom:0;left:0;width:44px;background:var(--pr-bg);border-radius:999px}
.slide-label{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding-left:36px;color:var(--muted);font-weight:600;font-size:13px;pointer-events:none;transition:opacity .12s}
.slide-thumb{z-index:2;position:absolute;top:4px;left:4px;width:36px;height:36px;border-radius:50%;background:var(--accent);color:var(--on-accent);display:flex;align-items:center;justify-content:center;font:700 22px/1 var(--display);touch-action:none;cursor:grab}
.slide:not(.drag) .slide-thumb{transition:transform .2s}
.slide:not(.drag) .slide-fill{transition:width .2s}
.modal{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.62);display:flex;align-items:flex-end;justify-content:center;
  padding:12px max(12px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px));overflow-y:auto}
.sheet{width:100%;max-width:520px;background:linear-gradient(165deg,#0f3a31 0%,var(--surface) 58%);border-radius:24px;padding:18px 16px 14px;text-align:center;
  box-shadow:inset 0 0 0 1px rgba(25,211,162,.4),0 20px 60px rgba(0,0,0,.5);animation:rise .28s cubic-bezier(.2,.8,.2,1)}
@keyframes rise{from{transform:translateY(40px) scale(.97);opacity:0}to{transform:none;opacity:1}}
.sheet .big{font:700 64px/1 var(--display);letter-spacing:-.03em;margin-top:2px}
.sheet .big small{font-size:18px;color:var(--muted);margin-left:5px;letter-spacing:0}
.sheet .okring{width:56px;height:56px;border-radius:50%;margin:2px auto 0;background:var(--accent);color:var(--on-accent);display:flex;align-items:center;justify-content:center}
.sheet .otitle{font:700 20px/1.2 var(--display);margin-top:10px;letter-spacing:-.01em}
.sheet .osub{color:var(--muted);font-size:14px;margin-top:2px}
.sheet .big{font-size:48px;margin:8px 0 12px}
.orows{background:rgba(255,255,255,.05);border-radius:16px;padding:2px 14px;margin:0 0 12px;text-align:left}
.orow{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:11px 0;border-top:1px solid rgba(255,255,255,.08);font-size:14px}
.orow:first-child{border-top:0}
.orow span{color:var(--muted);flex:none}
.orow b{font-weight:600;text-align:right;min-width:0;overflow-wrap:anywhere}
.orow b.pos{color:var(--good)}
.projh{display:flex;justify-content:space-between;gap:8px;margin-top:12px;text-align:left}
.projh .beatl{color:var(--accent)}
.projg{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin-top:6px}
.proj{border:0;border-radius:10px;background:var(--surface2);padding:6px 2px;display:flex;flex-direction:column;align-items:center;gap:1px;min-width:0}
.proj span{font:500 10px var(--body);color:var(--muted)}
.proj b{font:700 13px var(--display);letter-spacing:-.01em}
.proj.beat{background:var(--pr-bg)}
.proj.beat b{color:var(--accent)}
.proj.sel{box-shadow:inset 0 0 0 2px var(--accent)}
.trio{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.trio>div{background:var(--surface2);border-radius:12px;padding:8px 9px;min-width:0}
.trio .tv{font-size:19px;line-height:1.15;margin-top:3px}
.trio .u{font:500 11px var(--body);color:var(--muted);margin-left:3px}
.trio .note{font-size:10px;color:var(--muted);margin-top:1px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<div id="app">
  <div class="top"><div class="brand">G-WORK</div><div id="sync"></div></div>
  <main id="view"></main>
</div>
<nav class="tabs"><div class="in" id="tabs">
  <button data-act="tab" data-v="lifts">Lifts</button>
  <button data-act="tab" data-v="achievements">Achievements</button>
  <button data-act="tab" data-v="settings">Settings</button>
</div></nav>

<script>
(function(){
'use strict';
var LS='531log.v1';
var LIFTS=[],NAME={};
function syncLifts(){
  if(!Array.isArray(S.lifts))S.lifts=[];
  if(!S.setup){S.setup=true;S.lifts=S.lifts.filter(function(l){return S.pr[l.k]>0})}
  if(!S.act){S.act={};S.lifts.forEach(function(l){var m=0;S.prLog.forEach(function(q){
    var workout=!q.man&&(q.ach||q.r>1||q.c);
    if(q.l===l.k&&!workout)m=Math.max(m,q.e)});S.act[l.k]=m})}
  LIFTS=S.lifts;NAME={};LIFTS.forEach(function(l){NAME[l.k]=l.n;if(typeof S.pr[l.k]!=='number')S.pr[l.k]=0;if(typeof S.act[l.k]!=='number')S.act[l.k]=0});
  if(!S.pos){S.pos={};LIFTS.forEach(function(l){
    var c=S.cycle||1,w=S.week||1;
    var did=S.history.some(function(h){return h.l===l.k&&h.c===c&&h.w===w});
    if(did){if(w===4){c++;w=1}else w++}
    S.pos[l.k]={c:c,w:w};
  })}
  if(S.active)S.active.sets=S.active.sets.filter(function(x){return x.kind!=='w'});
}
var WEEKS={
  1:{name:'5s week',p:[[.65,5],[.75,5],[.85,5,1]]},
  2:{name:'3s week',p:[[.70,3],[.80,3],[.90,3,1]]},
  3:{name:'5/3/1 week',p:[[.75,5],[.85,3],[.95,1,1]]},
  4:{name:'Deload',p:[[.40,5],[.50,5],[.60,5]],deload:true}
};
function def(){return{v:1,upd:0,unit:'kg',setup:true,tmPct:90,restWork:180,
  lifts:[],pr:{},cycle:1,week:1,history:[],prLog:[],active:null}}
function load(){try{var r=JSON.parse(localStorage.getItem(LS));if(r&&r.v===1)return Object.assign(def(),r)}catch(e){}return null}
var S=load()||def();
var tab='lifts',summary=null,confirmReset=false,confirmDiscard=false,confirmLift=null,fired={};

/* ---------- math ---------- */
function r1(n){return Math.round(n*10)/10}
function f(n){var r=r1(n);return Number.isInteger(r)?String(r):r.toFixed(1)}
function inc(){return S.unit==='kg'?2.5:5}
function bar(){return S.unit==='kg'?20:45}
function roundTo(x,i){return Math.round(x/i)*i}
function tm(l){return Math.max(S.pr[l]||0,(S.act&&S.act[l])||0)*S.tmPct/100}
function e1(w,r){return r<=1?w:w*(1+r/30)}
function plates(w){
  var list=S.unit==='kg'?[25,20,15,10,5,2.5,1.25]:[45,35,25,10,5,2.5];
  var side=(w-bar())/2;if(side<=0)return 'Empty bar';
  var out=[];list.forEach(function(p){while(side>=p-1e-9){out.push(f(p));side-=p}});
  return 'Per side: '+out.join(' · ')+(side>0.01?' (+'+f(side)+' short)':'');
}
function buildSets(l,wk){
  var T=tm(l),W=WEEKS[wk],out=[];
  W.p.forEach(function(p){out.push({kind:p[2]?'a':'m',pct:p[0],wt:roundTo(T*p[0],inc()),target:p[1],reps:p[1],done:false})});
  return out;
}

/* ---------- persistence ---------- */
var syncState='local';
function save(){
  S.upd=Date.now();
  try{localStorage.setItem(LS,JSON.stringify(S));syncState='local'}catch(e){syncState='error'}
  showSync();
}
function showSync(){
  var el=document.getElementById('sync');
  el.textContent=syncState==='error'?'Could not save':'Saved on this device';
}
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}

/* ---------- audio / wake lock ---------- */
var ac=null;
function unlock(){try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume()}catch(e){}}
function beep(){
  try{unlock();[0,.28,.56].forEach(function(d){var o=ac.createOscillator(),g=ac.createGain();o.frequency.value=880;g.gain.value=.18;o.connect(g);g.connect(ac.destination);o.start(ac.currentTime+d);o.stop(ac.currentTime+d+.16)})}catch(e){}
  try{if(navigator.vibrate)navigator.vibrate([200,100,200])}catch(e){}
}
var wl=null;
async function wake(){try{if(S.active&&navigator.wakeLock&&!wl){wl=await navigator.wakeLock.request('screen');wl.addEventListener('release',function(){wl=null})}}catch(e){}}
document.addEventListener('visibilitychange',function(){if(document.visibilityState==='visible')wake()});

/* ---------- views ---------- */
function mmss(sec){sec=Math.max(0,Math.round(sec));return Math.floor(sec/60)+':'+String(sec%60).padStart(2,'0')}
function dateStr(t){return new Date(t).toLocaleDateString(undefined,{month:'short',day:'numeric'})}
function doneEntry(l){
  for(var i=S.history.length-1;i>=0;i--){var h=S.history[i];if(h.l===l&&h.c===S.cycle&&h.w===S.week)return h}
  return null;
}
function topOf(h){
  var best=null;h.sets.forEach(function(s){if(s[2]==='a')best=s});
  if(!best)h.sets.forEach(function(s){if(s[2]!=='w')best=s});
  return best;
}
function bestE1(h){var b=0;h.sets.forEach(function(s){if(s[2]!=='w')b=Math.max(b,e1(s[0],s[1]))});return b}

function pos(l){var p=S.pos&&S.pos[l];return p?{c:p.c,w:p.w}:{c:1,w:1}}
function nextPos(p){return p.w===4?{c:p.c+1,w:1}:{c:p.c,w:p.w+1}}
function prevPos(p){return p.w===1?(p.c>1?{c:p.c-1,w:4}:p):{c:p.c,w:p.w-1}}
function lastOf(l){for(var i=S.history.length-1;i>=0;i--)if(S.history[i].l===l)return S.history[i];return null}
function liftsHTML(){
  var h='<div class="stack"><h2>Lifts</h2>';
  if(!LIFTS.length)h+='<div class="card"><b>No lifts yet.</b><p class="hint" style="margin:4px 0 0">Add your first lift below with its current one-rep max. Weights are built from a training max of '+S.tmPct+'% of it.</p></div>';
  if(summary){
    var np=pos(summary.l);
    h+='<div class="banner"><div class="label" style="color:inherit">'+(NAME[summary.l]||'Lift')+' logged</div>'+
    '<div class="num">'+(summary.top?f(summary.top[0])+' × '+summary.top[1]:'No sets')+'</div>'+
    '<div>Estimated 1RM '+f(summary.e)+' '+S.unit+(summary.pr?'. <b>New projected PR.</b> Training max is now '+f(tm(summary.l))+' '+S.unit+'.':'.')+
    ' Next up: cycle '+np.c+', week '+np.w+'.</div>'+(summary.pr?'<button class="btn small" style="margin-top:6px" data-act="tab" data-v="achievements">View achievement</button>':'')+'</div>';
  }
  LIFTS.forEach(function(l,li){
    var p=pos(l.k),W=WEEKS[p.w],sets=buildSets(l.k,p.w),last=null,ld=lastOf(l.k);
    S.prLog.forEach(function(q){if(q.l===l.k)last=q});
    var lt=ld&&topOf(ld);
    h+='<div class="card pr-card stack">'+
    '<div class="name lift"><div class="name">'+l.n+'</div></div>'+
    '<div class="weekhead">'+
      '<button class="btn small" data-act="lw-prev" data-l="'+l.k+'" aria-label="Previous week for '+l.n+'"'+(p.c===1&&p.w===1?' disabled':'')+'>‹</button>'+
      '<div class="mid"><div class="label">Cycle '+p.c+' · Week '+p.w+' of 4</div><div class="big">'+W.name+'</div></div>'+
      '<button class="btn small" data-act="lw-next" data-l="'+l.k+'" aria-label="Next week for '+l.n+'">›</button></div>'+
    '<div class="lift"><div class="sets">'+sets.map(function(s){return '<span><b>'+f(s.wt)+'</b> × '+s.target+(s.kind==='a'?'+':'')+'</span>'}).join('')+'</div></div>'+
    '<button class="btn primary block" data-act="start" data-l="'+l.k+'">Start</button>'+
    (lt?'<div class="hint">Last: '+dateStr(ld.t)+' · C'+ld.c+' W'+ld.w+' · '+f(lt[0])+' × '+lt[1]+'</div>':'')+
    (function(){
      var A=S.act[l.k]||0,P=S.pr[l.k]||0,u='<span class="u">'+S.unit+'</span>';
      var cell=function(lab,v,note){return '<div><div class="label">'+lab+'</div><div class="num tv">'+(v?f(v)+u:'—')+'</div>'+(note?'<div class="note">'+note+'</div>':'')+'</div>'};
      return '<div class="trio">'+cell('Actual PR',A)+cell('Projected 1RM',P)+cell('Training max',Math.max(A,P)?tm(l.k):0,Math.max(A,P)?S.tmPct+'% of '+(A>P?'actual':'projected'):'')+'</div>';
    })()+
    '<input type="number" inputmode="decimal" id="pr-'+l.k+'" step="any" placeholder="Log actual PR ('+S.unit+')" aria-label="'+l.n+' actual PR">'+
    '<div class="slide" data-l="'+l.k+'"><span class="slide-label">Slide to log actual PR</span><div class="slide-fill"></div><div class="slide-thumb" role="button" tabindex="0" aria-label="Slide right or press Enter to log '+l.n+' actual PR">›</div></div>'+
    (LIFTS.length>0?'<button class="btn small ghost danger" data-act="lift-del" data-l="'+l.k+'">'+(confirmLift===l.k?'Tap again to remove lift':'Remove lift')+'</button>':'')+'</div>';
  });
  h+='<div class="card stack"><div class="label">Add a lift</div><div class="field"><label class="label" for="nl-name">Name</label><input type="text" id="nl-name" maxlength="40" placeholder="e.g. Barbell Row"></div>'+
    '<div class="field"><label class="label" for="nl-pr">Current 1RM ('+S.unit+')</label><input type="number" inputmode="decimal" id="nl-pr" min="1" step="any"></div>'+
    '<button class="btn primary block" data-act="lift-add">Add lift</button></div>';
  return h+'</div>';
}

function projHTML(s,a){
  var pr=S.pr[a.lift]||0,from=Math.max(1,s.target),h='';
  for(var r=from;r<from+10;r++){
    var e=e1(s.wt,r),beat=r1(e)>pr;
    h+='<button class="proj'+(beat?' beat':'')+(r===s.reps?' sel':'')+'" data-act="rp-set" data-n="'+r+'" aria-label="'+r+' reps, projected 1RM '+f(e)+(beat?', new PR':'')+'"><span>'+r+' reps</span><b>'+f(e)+'</b></button>';
  }
  return '<div class="projh"><span class="label">Projected 1RM at '+f(s.wt)+' '+S.unit+'</span><span class="label beatl">Mint = new PR</span></div><div class="projg">'+h+'</div>';
}
function workoutHTML(){
  var a=S.active,W=WEEKS[a.week],idx=a.sets.findIndex(function(s){return !s.done});
  var h='<div class="stack"><div class="row"><div><div class="label">Cycle '+a.cycle+' · Week '+a.week+' · '+W.name+'</div><h2>'+NAME[a.lift]+'</h2></div>'+
    '</div>';
  var anyDone=a.sets.some(function(s){return s.done});
  if(idx>=0){
    var s=a.sets[idx],wn=0,wt=0;
    a.sets.forEach(function(x,i){if(x.kind!=='w'){wt++;if(i<=idx)wn++}});
    var label=(s.kind==='a'?'Final set · as many reps as you can':'Set '+wn+' of '+wt);
    if(a.restStart){
      h+='<div class="rest" id="restbox"><div class="row"><span class="label">Rest</span><span class="label" id="rtarget"></span></div><div class="t" id="rt">0:00</div><div class="bar"><i id="rbar"></i></div>'+
      '<div class="row"><button class="btn small" data-act="rest-add">+30 s</button><button class="btn small" data-act="rest-skip">Skip rest</button></div></div>';
    }
    h+='<div class="card cur"><div class="label">'+label+'</div>'+
    '<div style="margin-top:8px"><span class="num w">'+f(s.wt)+'</span><span class="unit">'+S.unit+'</span></div>'+
    '<div class="tgt">× '+s.target+(s.kind==='a'?'+':'')+'</div><div class="plates">'+plates(s.wt)+'</div>'+
    (idx===a.sets.length-1?projHTML(s,a):'')+
    '<div class="steps"><div class="stepper"><button data-act="wt-" aria-label="Lighter">−</button><div class="v">'+f(s.wt)+'<small>weight</small></div><button data-act="wt+" aria-label="Heavier">+</button></div>'+
    '<div class="stepper"><button data-act="rp-" aria-label="Fewer reps">−</button><div class="v">'+s.reps+'<small>reps done</small></div><button data-act="rp+" aria-label="More reps">+</button></div></div>'+
    '<button class="btn primary block" data-act="log" style="min-height:42px">Log set</button></div>';
  }else{
    h+='<div class="card stack"><h2>All sets done</h2><p class="hint" style="margin:0">Save the workout to update your PRs and mark this lift complete.</p>'+
    '<button class="btn primary block" data-act="finish" style="min-height:42px">Finish workout</button></div>';
  }
  h+='<div class="card"><div class="setlist">'+a.sets.map(function(s,i){
    var cls=s.done?'ok':(i===idx?'on':'');
    var nm='Set';
    return '<div class="'+cls+'"><span>'+nm+' · '+Math.round(s.pct*100)+'%'+'</span><span>'+(s.done?'<b>'+f(s.wt)+' × '+s.reps+'</b> ✓':f(s.wt)+' × '+s.target+(s.kind==='a'?'+':''))+'</span></div>';
  }).join('')+'</div></div>';
  h+='<div class="row">'+(anyDone?'<button class="btn small" data-act="undo">Undo last set</button>':'<span></span>')+
    (idx>=0&&anyDone?'<button class="btn small" data-act="finish">Finish early</button>':'')+'</div>';
  h+='<button class="btn danger small block" data-act="discard">'+(confirmDiscard?'Tap again to discard workout':'Discard workout')+'</button>';
  return h+'</div>';
}

function dateLong(t){return new Date(t).toLocaleDateString(undefined,{day:'numeric',month:'short',year:'numeric'})}
function achHTML(){
  var items=[];
  S.prLog.forEach(function(p,i){if(p.ach)items.push([p,i])});
  items.reverse();
  var h='<div class="stack"><h2>Achievements</h2>';
  if(!items.length)return h+'<div class="card"><b>No PRs yet.</b><p class="hint" style="margin:4px 0 0">Beat your projected 1RM in a working set, or slide in an actual PR on the Lifts tab, and it shows up here.</p></div></div>';
  items.forEach(function(it){
    var p=it[0],i=it[1];
    h+='<div class="trophy"><div class="logo">G-WORK</div><div class="tag">'+(p.man?'ACTUAL PR':'PROJECTED PR')+'</div>'+
    '<div class="lf">'+(NAME[p.l]||p.n||'Lift')+'</div>'+
    '<div class="big">'+f(p.e)+'<small>'+S.unit+'</small></div>'+
    '<div class="sub">'+(p.man?'Logged manually':'Estimated 1RM from '+f(p.wt)+' × '+p.r)+(p.p?' · +'+f(p.e-p.p)+(p.man?' on the previous actual PR':' on the last projection'):'')+'</div>'+
    '<div class="foot">'+dateLong(p.t)+(p.c?' · Cycle '+p.c+', week '+p.wk:'')+'</div>'+
    '<button class="btn small" style="margin-top:6px" data-act="share" data-i="'+i+'">Save image</button></div>';
  });
  return h+'</div>';
}
async function shareCard(i){
  var p=S.prLog[i];if(!p)return;
  try{await document.fonts.load("italic 900 100px Barlow");await document.fonts.load("700 100px 'DM Sans'")}catch(e){}
  var W=1080,H=1350,cv=document.createElement('canvas');cv.width=W;cv.height=H;
  var g=cv.getContext('2d'),mono="'DM Sans','Helvetica Neue',Arial,sans-serif";
  g.fillStyle='#0b0e12';g.fillRect(0,0,W,H);
  g.fillStyle='#141920';g.fillRect(60,60,W-120,H-120);
  g.strokeStyle='#19d3a2';g.lineWidth=12;g.strokeRect(60,60,W-120,H-120);
  g.textAlign='center';
  g.fillStyle='#19d3a2';g.font="italic 900 170px Barlow,'Arial Black',Impact,sans-serif";g.fillText('G-WORK',W/2,270);
  g.fillStyle='#8a95a3';g.font='bold 46px '+mono;g.fillText(p.man?'ACTUAL PR':'PROJECTED PR',W/2,380);
  var name=(NAME[p.l]||p.n||'Lift').toUpperCase(),sz=84;
  g.fillStyle='#f2f5f7';
  do{g.font='bold '+sz+'px '+mono;sz-=4}while(g.measureText(name).width>W-220&&sz>30);
  g.fillText(name,W/2,560);
  g.font='bold 250px '+mono;g.fillText(f(p.e),W/2,840);
  g.fillStyle='#8a95a3';g.font='bold 58px '+mono;g.fillText(S.unit+(p.man?'  actual PR':'  projected 1RM'),W/2,935);
  g.font='48px '+mono;g.fillText(p.man?'logged manually':'from '+f(p.wt)+' x '+p.r,W/2,1035);
  g.fillText(dateLong(p.t),W/2,1115);
  var blob=await new Promise(function(res){cv.toBlob(res,'image/png')});
  if(!blob)return;
  var file=new File([blob],'g-work-pr.png',{type:'image/png'});
  try{
    if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:'G-WORK PR'});return}
  }catch(e){if(e&&e.name==='AbortError')return}
  var u=URL.createObjectURL(blob),a2=document.createElement('a');
  a2.href=u;a2.download='g-work-pr.png';document.body.appendChild(a2);a2.click();a2.remove();
  setTimeout(function(){URL.revokeObjectURL(u)},1000);
}

function settingsHTML(){
  function sel(id,opts,cur){return '<select id="'+id+'" data-set="'+id+'">'+opts.map(function(o){return '<option value="'+o[0]+'"'+(String(o[0])===String(cur)?' selected':'')+'>'+o[1]+'</option>'}).join('')+'</select>'}
  return '<div class="stack"><h2>Settings</h2><div class="card stack">'+
  '<div class="field"><label class="label" for="unit">Units</label>'+sel('unit',[['lb','Pounds (lb), 45 lb bar, 5 lb steps'],['kg','Kilograms (kg), 20 kg bar, 2.5 kg steps']],S.unit)+'</div>'+
  '<div class="field"><label class="label" for="tmPct">Training max as % of your higher 1RM</label>'+sel('tmPct',[[85,'85%'],[90,'90% (standard)'],[95,'95%'],[100,'100%']],S.tmPct)+'</div>'+
  '<div class="field"><label class="label" for="restWork">Rest between sets</label>'+sel('restWork',[[90,'1:30'],[120,'2:00'],[180,'3:00'],[240,'4:00'],[300,'5:00']],S.restWork)+'</div>'+
  '</div><div class="card stack"><div class="label">Backup</div><p class="hint" style="margin:0">Your data lives only in this browser. Export a copy now and then, and use import to move it to another device.</p>'+
  '<div class="row"><button class="btn small" data-act="export">Export backup</button><label class="btn small" for="imp" style="display:inline-flex;align-items:center">Import backup</label><input type="file" id="imp" accept="application/json,.json" hidden></div>'+
  '</div><div class="card stack"><div class="label">Reset</div><p class="hint" style="margin:0">Erases PRs, history and program position.</p>'+
  '<button class="btn danger" data-act="reset">'+(confirmReset?'Tap again to erase everything':'Erase all data')+'</button></div><div class="hint" style="text-align:center">G-WORK build 12</div></div>';
}

function render(){
  syncLifts();
  var v=document.getElementById('view');
  v.innerHTML=tab==='lifts'?(S.active?workoutHTML():liftsHTML()):tab==='achievements'?achHTML():settingsHTML();
  Array.prototype.forEach.call(document.querySelectorAll('#tabs button'),function(b){b.setAttribute('aria-current',b.dataset.v===tab)});
  tick();
}

/* ---------- rest timer ---------- */
function tick(){
  var a=S.active;if(!a||!a.restStart)return;
  var el=document.getElementById('rt');if(!el)return;
  var left=a.restTarget-(Date.now()-a.restStart)/1000;
  var box=document.getElementById('restbox');
  if(left>0){el.textContent=mmss(Math.ceil(left));box.classList.remove('over')}
  else{el.textContent='+'+mmss(-left);box.classList.add('over');
    if(!fired[a.restStart]){fired[a.restStart]=1;beep()}}
  document.getElementById('rbar').style.width=Math.min(100,(1-left/a.restTarget)*100)+'%';
  document.getElementById('rtarget').textContent='Target '+mmss(a.restTarget);
}
setInterval(tick,250);

/* ---------- actions ---------- */
function cur(){var a=S.active;return a?a.sets.find(function(s){return !s.done}):null}
function finish(){
  var a=S.active,done=a.sets.filter(function(s){return s.done}),l=a.lift;
  confirmDiscard=false;
  if(!done.length){S.active=null;save();render();return}
  var rec={id:Date.now(),n:NAME[l],t:Date.now(),l:l,c:a.cycle,w:a.week,sets:done.map(function(s){return [s.wt,s.reps,s.kind]})};
  S.history.push(rec);
  var best=0,bs=null;
  done.forEach(function(s){if(s.kind!=='w'){var e=e1(s.wt,s.reps);if(e>best){best=e;bs=s}}});
  var isPR=false;
  if(bs&&r1(best)>S.pr[l]){var prev=S.pr[l];S.pr[l]=r1(best);S.prLog.push({t:rec.t,l:l,n:NAME[l],e:r1(best),wt:bs.wt,r:bs.reps,p:prev,c:a.cycle,wk:a.week,ach:1});isPR=true}
  S.pos[l]=nextPos({c:a.cycle,w:a.week});
  summary={l:l,top:topOf(rec),e:best,pr:isPR};
  S.active=null;
  if(wl){try{wl.release()}catch(e){}wl=null}
  save();render();window.scrollTo(0,0);
}
function convert(to){
  if(to===S.unit)return;
  var k=to==='kg'?0.45359237:1/0.45359237,c=function(x){return r1(x*k)};
  Object.keys(S.pr).forEach(function(l){S.pr[l]=c(S.pr[l])});
  Object.keys(S.act||{}).forEach(function(l){S.act[l]=c(S.act[l])});
  S.history.forEach(function(h){h.sets.forEach(function(s){s[0]=c(s[0])})});
  S.prLog.forEach(function(p){p.e=c(p.e);p.wt=c(p.wt);if(p.p)p.p=c(p.p);if(p.tp)p.tp=c(p.tp);if(p.t0)p.t0=c(p.t0)});
  S.active=null;S.unit=to;
}
document.addEventListener('click',function(ev){
  if(ev.target&&ev.target.id==='modal'){closePopup();return}
  var b=ev.target.closest('[data-act]');if(!b)return;
  var act=b.dataset.act,a=S.active,s;
  if(act!=='reset')confirmReset=false;
  if(act!=='discard')confirmDiscard=false;
  if(act!=='lift-del')confirmLift=null;
  switch(act){
    case 'tab':tab=b.dataset.v;render();window.scrollTo(0,0);return;
    case 'lw-prev':S.pos[b.dataset.l]=prevPos(pos(b.dataset.l));save();render();return;
    case 'lw-next':S.pos[b.dataset.l]=nextPos(pos(b.dataset.l));save();render();return;
    case 'start':unlock();summary=null;tab='lifts';var sp=pos(b.dataset.l);S.active={lift:b.dataset.l,cycle:sp.c,week:sp.w,sets:buildSets(b.dataset.l,sp.w),restStart:null,restTarget:0,startedAt:Date.now()};save();wake();render();window.scrollTo(0,0);return;
    case 'wt+':s=cur();if(s){s.wt=r1(s.wt+inc());save();render()}return;
    case 'wt-':s=cur();if(s){s.wt=Math.max(0,r1(s.wt-inc()));save();render()}return;
    case 'rp+':s=cur();if(s){s.reps++;save();render()}return;
    case 'rp-':s=cur();if(s){s.reps=Math.max(0,s.reps-1);save();render()}return;
    case 'rp-set':s=cur();if(s){s.reps=parseInt(b.dataset.n,10);save();render()}return;
    case 'log':
      unlock();s=cur();if(!s)return;
      s.done=true;
      if(a.sets.some(function(x){return !x.done})){a.restStart=Date.now();a.restTarget=S.restWork}
      else a.restStart=null;
      save();render();window.scrollTo(0,0);return;
    case 'undo':
      for(var i=a.sets.length-1;i>=0;i--){if(a.sets[i].done){a.sets[i].done=false;break}}
      a.restStart=null;save();render();return;
    case 'rest-add':a.restTarget+=30;save();render();return;
    case 'rest-skip':a.restStart=null;save();render();return;
    case 'finish':finish();return;
    case 'discard':
      if(!confirmDiscard){confirmDiscard=true;render();return}
      confirmDiscard=false;S.active=null;save();render();return;
    case 'lift-add':{
      var nm=document.getElementById('nl-name').value.trim(),pv=parseFloat(document.getElementById('nl-pr').value);
      if(!nm||!(pv>0)){alert_('Enter a name and a 1RM.');return}
      var key='c'+Date.now().toString(36);
      S.lifts.push({k:key,n:nm});S.pos[key]={c:1,w:1};S.pr[key]=r1(pv);S.act[key]=r1(pv);S.prLog.push({t:Date.now(),l:key,e:r1(pv),wt:r1(pv),r:1});
      save();render();return}
    case 'lift-del':
      if(confirmLift!==b.dataset.l){confirmLift=b.dataset.l;render();return}
      confirmLift=null;S.lifts=S.lifts.filter(function(x){return x.k!==b.dataset.l});
      if(S.active&&S.active.lift===b.dataset.l)S.active=null;
      save();render();return;
    case 'pop-close':closePopup();return;
    case 'pop-ach':closePopup();tab='achievements';render();window.scrollTo(0,0);return;
    case 'share':shareCard(parseInt(b.dataset.i,10));return;
    case 'export':{
      var blob=new Blob([JSON.stringify(S,null,1)],{type:'application/json'}),u=URL.createObjectURL(blob),a2=document.createElement('a');
      a2.href=u;a2.download='g-work-backup-'+new Date().toISOString().slice(0,10)+'.json';document.body.appendChild(a2);a2.click();a2.remove();
      setTimeout(function(){URL.revokeObjectURL(u)},1000);return}
    case 'reset':
      if(!confirmReset){confirmReset=true;render();return}
      confirmReset=false;S=def();summary=null;save();render();return;
  }
});
function alert_(msg){
  var el=document.getElementById('sync');el.textContent=msg;el.style.color='var(--warn)';
  setTimeout(function(){el.style.color='';showSync()},2500);
}
function showPopup(info){
  var p=S.prLog[info.i];if(!p)return;
  var prev=p.p,d=prev?p.e-prev:0,pct=prev?d/prev*100:0,u=' '+S.unit;
  var row=function(l,v,c){return '<div class="orow"><span>'+l+'</span><b'+(c?' class="'+c+'"':'')+'>'+v+'</b></div>'};
  var when=new Date(p.t).toLocaleString(undefined,{day:'numeric',month:'short',year:'numeric',hour:'numeric',minute:'2-digit'});
  var h='<div class="sheet" role="dialog" aria-modal="true" aria-labelledby="pop-t">'+
    '<div class="okring"><svg viewBox="0 0 24 24" width="30" height="30" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg></div>'+
    '<div class="otitle" id="pop-t">PR logged</div>'+
    '<div class="osub">'+(NAME[p.l]||p.n||'Lift')+'</div>'+
    '<div class="big">'+f(p.e)+'<small>'+S.unit+'</small></div>'+
    '<div class="orows">'+
      row('Type','Actual PR · manual')+
      row('Previous actual PR',prev?f(prev)+u:'—')+
      row('New actual PR',f(p.e)+u)+
      row('Change',prev?'+'+f(d)+u+' (+'+pct.toFixed(1)+'%)':'—','pos')+
      row('Projected 1RM',f(p.tp||p.e)+u)+
      row('Training max',(p.t0?f(p.t0)+' → ':'')+f(tm(p.l))+u)+
      row('Logged',when)+
    '</div>'+
    '<button class="btn primary block" data-act="pop-close" id="pop-done">Done</button>'+
    '<button class="btn block ghost" style="margin-top:6px" data-act="pop-ach">View achievements</button>'+
    '</div>';
  var el=document.getElementById('modal');
  if(!el){el=document.createElement('div');el.id='modal';document.body.appendChild(el)}
  el.className='modal';el.innerHTML=h;
  var done=document.getElementById('pop-done');if(done&&done.focus)done.focus();
}
function closePopup(){var el=document.getElementById('modal');if(el)el.remove()}
function manualPR(l){
  var el=document.getElementById('pr-'+l),n=el?parseFloat(el.value):NaN;
  if(!(n>0)){alert_('Enter a PR first.');return false}
  var v=r1(n),prevAct=S.act[l]||0,old=tm(l);
  S.act[l]=v;if(v>(S.pr[l]||0))S.pr[l]=v;
  var up=v>prevAct;
  S.prLog.push({t:Date.now(),l:l,n:NAME[l],e:v,wt:v,r:1,p:prevAct,tp:S.pr[l],t0:old,man:1,ach:up?1:0});
  save();render();
  if(up)showPopup({i:S.prLog.length-1});return true;
}
var drag=null;
document.addEventListener('pointerdown',function(e){
  var th=e.target.closest&&e.target.closest('.slide-thumb');if(!th)return;
  var tr=th.parentNode;
  drag={th:th,tr:tr,x0:e.clientX,max:tr.clientWidth-th.offsetWidth-8,dx:0};
  try{th.setPointerCapture(e.pointerId)}catch(x){}
  tr.classList.add('drag');e.preventDefault();
});
document.addEventListener('pointermove',function(e){
  if(!drag)return;
  var dx=Math.max(0,Math.min(drag.max,e.clientX-drag.x0));drag.dx=dx;
  drag.th.style.transform='translateX('+dx+'px)';
  drag.tr.querySelector('.slide-fill').style.width=(dx+44)+'px';
  drag.tr.querySelector('.slide-label').style.opacity=dx>6?'0':'';
});
function endDrag(){
  if(!drag)return;
  var d=drag;drag=null;d.tr.classList.remove('drag');
  if(d.max>0&&d.dx>=d.max*0.9){
    if(manualPR(d.tr.dataset.l))return;
  }
  d.th.style.transform='';d.tr.querySelector('.slide-fill').style.width='';d.tr.querySelector('.slide-label').style.opacity='';
}
document.addEventListener('pointerup',endDrag);
document.addEventListener('pointercancel',endDrag);
document.addEventListener('keydown',function(e){
  if(e.key==='Escape')closePopup();
  var th=e.target.closest&&e.target.closest('.slide-thumb');
  if(th&&(e.key==='Enter'||e.key===' '||e.key==='ArrowRight')){e.preventDefault();manualPR(th.parentNode.dataset.l)}
});
document.addEventListener('change',function(ev){
  var t=ev.target;
  if(t.id==='imp'){
    var file=t.files&&t.files[0];if(!file)return;
    var rd=new FileReader();
    rd.onload=function(){
      try{
        var d=JSON.parse(rd.result);
        if(!d||d.v!==1||!d.pr||!Array.isArray(d.history))throw 0;
        S=Object.assign(def(),d);summary=null;save();render();alert_('Backup imported.');
      }catch(e){alert_('That file is not a G-WORK backup.')}
    };
    rd.readAsText(file);t.value='';return;
  }
  var k=t.dataset&&t.dataset.set;if(!k)return;
  var v=t.value;
  if(k==='unit')convert(v);
  else S[k]=parseInt(v,10);
  save();render();
});

render();showSync();
if('serviceWorker' in navigator&&location.protocol.indexOf('http')===0)window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})});
})();
